[package]
name = "tcad_native"
version = "0.1.0"
edition = "2021"
description = "Compiled kernels for tcad1d (optional; every kernel has a numpy fallback)"
publish = false

[lib]
name = "tcad_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
