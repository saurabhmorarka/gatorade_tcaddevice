# Bulk FinFET NMOS, 2 nm-node class (fab/templates.py finfet): one fin in
# one contacted poly pitch. Lengths in nm unless a unit is given.
#
#   python3 -m fab build configs/fab_finfet.yaml
#   python3 -m tcadview out/fab_finfet/build.pvd
template: finfet
params:
  type: nmos
  cpp: 48nm
  Lg: 15nm
  W_fin: 5nm
  H_fin: 50nm
  fin_pitch: 24nm
