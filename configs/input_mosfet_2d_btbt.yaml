# 2D planar NMOS for band-to-band tunneling leakage (btbt2d/): the same
# Lg=0.5um device as configs/input_mosfet_2d.yaml, with the two changes a
# device needs before BTBT can show up at all:
#
#  1. Uniform p 1e18 substrate (was 1e16). At 1e16 the drain-body junction
#     field at Vdb=1V is ~8e4 V/cm and Kane's exp(-B/F) ~ exp(-270): no
#     junction BTBT at any reachable bias. At 1e18 it is ~8e5 V/cm.
#     An n+ poly gate (workfunction = chi = 4.05 eV, V_FB ~ -1.04 V) on a
#     3nm oxide keeps Vt ~0.4-0.5 V despite the heavy body.
#
#  2. The drain (and source) extended 40nm under the gate. GIDL is the
#     gate depleting the drain surface under the gate edge; with no overlap
#     there is no such surface. The drain is laterally graded in two steps:
#     an n 3e18 tip (the part under and next to the gate) and the n+ 1e20
#     body. The band bending needed for tunneling (~Eg) takes Vdg ~ psi_s +
#     sqrt(2 q eps Nd psi_s)/Cox ~ 7 V at 1e20 but ~2 V at 3e18. The tip
#     spans the full junction depth: a shallow (30nm) tip was tried first
#     and is fully depleted between the gate and the p body - the drain
#     potential never reaches the gate edge and there is no GIDL at all.

geometry:
  width_um: 1.1
  height_um: 0.5

  substrate:
    doping_type: p
    concentration_cm3: 1.0e18

  regions:
    - name: source_tip
      doping_type: n
      concentration_cm3: 3.0e18
      x_range_um: [0.2, 0.34]
      y_range_um: [0.0, 0.15]
    - name: drain_tip
      doping_type: n
      concentration_cm3: 3.0e18
      x_range_um: [0.76, 0.9]
      y_range_um: [0.0, 0.15]
    - name: source
      doping_type: n
      concentration_cm3: 1.0e20
      x_range_um: [0.0, 0.27]
      y_range_um: [0.0, 0.15]
    - name: drain
      doping_type: n
      concentration_cm3: 1.0e20
      x_range_um: [0.83, 1.1]
      y_range_um: [0.0, 0.15]
    - name: oxide
      kind: insulator
      eps_r: 3.9
      x_range_um: [0.3, 0.8]
      y_range_um: [-0.003, 0.0]   # 3nm

  mesas:
    - x_range_um: [0.3, 0.8]
      height_um: 0.003

contacts:
  - name: source
    surface: top
    x_range_um: [0.0, 0.25]
    bias_role: source
  - name: drain
    surface: top
    x_range_um: [0.85, 1.1]
    bias_role: drain
  - name: gate
    surface: top
    x_range_um: [0.3, 0.8]
    bias_role: gate
  - name: body
    surface: bottom
    x_range_um: [0.0, 1.1]
    bias_role: body

physics:
  velocity_saturation: true

gate:
  workfunction_eV: 4.05   # n+ poly

mesh:
  style: quadtree
  h_min_um: 0.0025
  h_max_um: 0.05
  growth: 1.3
  interface_h_um: 0.0025
  junction_h_um: 0.01
  refine_boxes:
    - name: channel
      x_range_um: [0.2, 0.9]
      y_range_um: [0.0, 0.04]
      h_um: 0.01

btbt:
  vds_V: 1.0
  vgs_start_V: 1.0
  vgs_stop_V: -2.0
  vgs_step_V: 0.2
  vsub_start_V: 0.0
  vsub_stop_V: -3.0
  vsub_step_V: 0.2
  vgs_for_vsub_V: 0.0
