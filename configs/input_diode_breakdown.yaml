# 1D diode simulation input parameters - AVALANCHE BREAKDOWN example.
#
# Run with: python3 -m avalanche.main_avalanche
#
# Special, opt-in example (NOT part of a normal CMOS flow): a one-sided
# step junction, heavy p-side (1e19 cm^-3) / light n-side (1e17 cm^-3), so
# essentially all the depletion width and field sit on the lighter n-side -
# the standard "one-sided abrupt junction" assumption Sze's empirical
# breakdown-voltage formula requires. At this doping,
# analytic.breakdown_voltage_sze() gives BV ~= 11V; the solver, using the
# van Overstraeten-de Man ionization coefficients, breaks down at ~14.1V
# (defined at |J| = 1 A/cm^2), and the ionization integral evaluated on its
# own solved field is ~1 there - the gap to Sze is the coefficient set, not
# the solve. Lighter (1e16, BV~52V) and heavier/graded devices are exercised
# by avalanche/robustness_matrix.py.
#
# Domain sizing: Wn_um comfortably exceeds the depletion width even past
# breakdown (<0.5 um at Va=-16V, per analytic.depletion_widths) - the
# default auto-sizing in mesh.build_diode_grid has no notion of "grow for
# eventual breakdown depletion width", only for the ordinary
# minority-carrier diffusion length.

doping:
  p_side:
    type: flat
    concentration_cm3: 1.0e19
  n_side:
    type: flat
    concentration_cm3: 1.0e17   # lighter side sets the breakdown voltage (~11V here)

thickness:
  Wp_um: 1.0   # heavy side: depletion barely penetrates here, quasi-neutral bulk only
  Wn_um: 6.0   # light side: comfortably exceeds the depletion width even past breakdown

material:
  # eps_r: 11.7
  # ni_cm3: 1.0e10

mesh:
  growth: 1.10
  bulk_spacing_debye_factor: 5.0
  # 0.3 Debye lengths of the heavy side at the junction (~0.4 nm cells).
  # An earlier version of this example needed 0.05 because loosening the mesh
  # appeared to make the avalanche runaway vanish - that was a numerics bug
  # (roundoff-dominated majority-carrier current feeding the generation term,
  # see DEVELOPMENT_LOG.md session 23), not a resolution requirement. With
  # the current solver, avalanche/robustness_matrix.py shows BV agreeing to
  # within ~0.2% from 0.05 down to 1.0 (a few-nm junction cells).
  junction_spacing_debye_factor: 0.3

avalanche:
  enabled: true        # also cap h_min at the ionization mean free path (no effect for this device)
  E_crit_V_cm: 4.0e5   # a-priori peak-field estimate, used only for that mesh cap
  cells_per_mfp: 8.0
  # ii_model defaults to Si van Overstraeten-de Man (avalanche.py)

  # Impact-ionization driving force: hybrid (default) | gradqf | efield -
  # see newton_solver_avalanche.py's module docstring. hybrid uses the
  # quasi-Fermi gradient where a carrier is dense and the field where it is
  # sparse; efield cannot converge once either side is doped >~1e20.
  driving_force: hybrid
  ref_density_cm3: 1.0e16

  # Arc-length trace (main_avalanche.py): voltage-controlled seed steps to
  # seed_V, then follow the I-V curve itself - through the near-vertical
  # knee and any turn-back - until |J| reaches J_stop_A_cm2. No bias
  # schedule to tune (this replaces the old hand-tuned fine_tail block).
  continuation:
    seed_V: -1.0
    J_stop_A_cm2: 1.0e3
    V_limit: 100.0
    ds_max: 1.0

voltage_sweep:
  # Only used if this device is swept through the generic voltage-controlled
  # path (math_model newton_avalanche via core.solver.voltage_sweep);
  # main_avalanche.py uses the arc-length trace above instead. A voltage-
  # controlled sweep converges fine up to the knee but cannot follow the
  # near-vertical curve through it.
  reverse_start_V: -0.05
  reverse_stop_V: -13.5
  reverse_points: 60
  forward_start_V: 0.0
  forward_stop_V: 0.6
  forward_points: 8

solver:
  math_model: newton_avalanche

output:
  # main_avalanche.py saves fields at fixed current levels instead;
  # these are only for the generic voltage-controlled path.
  save_bias_points: [-1, -6, -10, -13]
  structure_file: diode_breakdown_structure.json
