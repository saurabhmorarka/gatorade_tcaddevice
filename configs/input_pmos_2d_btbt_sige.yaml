# 2D planar PMOS for band-to-band / trap-assisted tunneling leakage (btbt/):
# the NMOS of configs/input_mosfet_2d_btbt.yaml with every doping and bias
# polarity reversed - n 1e18 body, p+ 1e20 source/drain with a p 3e18 tip
# extended 40nm under the gate, p+ poly gate (workfunction chi + Eg = 5.17 eV,
# V_FB ~ +1.04 V, Vt ~ -0.45 V). Vds = -1 V. GIDL grows as Vg goes POSITIVE
# (the gate depletes the p drain surface under the gate edge); the
# drain-body junction is reverse-biased further by a POSITIVE body bias.
# THIS variant: the whole p-type source/drain (tip + p+ body) is
# compressively strained Si0.6Ge0.4 grown on Si (embedded SiGe S/D):
# Eg ~0.82 eV, the whole ~0.30 eV offset in the valence band (People & Bean,
# core/materials.py), so the metallurgical junction is also a
# heterojunction. Everything else is identical to configs/input_pmos_2d_btbt.yaml.

geometry:
  width_um: 1.1
  height_um: 0.5

  substrate:
    doping_type: n
    concentration_cm3: 1.0e18

  regions:
    - name: source_tip
      doping_type: p
      concentration_cm3: 3.0e18
      x_range_um: [0.2, 0.34]
      y_range_um: [0.0, 0.15]
      material: &sige
        name: SiGe_x0.4_strained
        alloy:
          end_member_a: Silicon
          end_member_b: Germanium
          x_a: 0.6
          bowing_eV: 0.36
          strain:
            substrate: Silicon
            x_substrate_Ge: 0.0
    - name: drain_tip
      doping_type: p
      concentration_cm3: 3.0e18
      x_range_um: [0.76, 0.9]
      y_range_um: [0.0, 0.15]
      material: *sige
    - name: source
      doping_type: p
      concentration_cm3: 1.0e20
      x_range_um: [0.0, 0.27]
      y_range_um: [0.0, 0.15]
      material: *sige
    - name: drain
      doping_type: p
      concentration_cm3: 1.0e20
      x_range_um: [0.83, 1.1]
      y_range_um: [0.0, 0.15]
      material: *sige
    - name: oxide
      kind: insulator
      eps_r: 3.9
      x_range_um: [0.3, 0.8]
      y_range_um: [-0.003, 0.0]   # 3nm

  mesas:
    - x_range_um: [0.3, 0.8]
      height_um: 0.003

contacts:
  - name: source
    surface: top
    x_range_um: [0.0, 0.25]
    bias_role: source
  - name: drain
    surface: top
    x_range_um: [0.85, 1.1]
    bias_role: drain
  - name: gate
    surface: top
    x_range_um: [0.3, 0.8]
    bias_role: gate
  - name: body
    surface: bottom
    x_range_um: [0.0, 1.1]
    bias_role: body

physics:
  velocity_saturation: true

gate:
  workfunction_eV: 5.17   # p+ poly (chi + Eg)

mesh:
  style: quadtree
  h_min_um: 0.0025
  h_max_um: 0.05
  growth: 1.3
  interface_h_um: 0.0025
  junction_h_um: 0.005    # 5nm: resolves the SiGe/Si valence-band step in the SiGe variant
  refine_boxes:
    - name: channel
      x_range_um: [0.2, 0.9]
      y_range_um: [0.0, 0.04]
      h_um: 0.01

btbt:
  vds_V: -1.0
  vgs_start_V: -1.0      # on-state end
  vgs_stop_V: 2.0        # GIDL end
  vgs_step_V: 0.2
  vsub_start_V: 0.0
  vsub_stop_V: 3.0       # reverse body bias (PMOS: positive)
  vsub_step_V: 0.2
  vgs_for_vsub_V: 0.0
