# 2D planar NMOS (Lg 30 nm) on the geometry of mechanics/planar_flow.py's
# process cell, for stress -> mobility (piezoresistance, docs/piezo_mobility.md).
# The device is the cell between the two STI walls: planar_flow x 20..154 nm
# is x 0..134 nm here, and the gate is centred at 67 nm (87 nm in the cell).
# The process stress of the planar_flow NMOS flow (stress memorization, SMT
# dislocations, tensile liner) is solved first and sampled on every silicon
# edge of the device mesh (the stress: block below). Remove the stress: block
# for the unstressed device.
#
# The electrical stack is a stand-in: a 1 nm oxide (the EOT of the cell's
# 2 nm SiO2 / HfO2 stack is not modelled), an n+ poly-like gate workfunction,
# a p 3e18 body, n+ 1e20 S/D 25 nm deep with the junction at the gate edge.
#
#   python3 main2d_mosfet_sweep.py configs/input_mosfet_2d_stress_nmos.yaml

geometry:
  width_um: 0.134
  height_um: 0.1

  substrate:
    doping_type: p
    concentration_cm3: 3.0e18

  regions:
    - name: source
      doping_type: n
      concentration_cm3: 1.0e20
      x_range_um: [0.0, 0.052]
      y_range_um: [0.0, 0.025]
    - name: drain
      doping_type: n
      concentration_cm3: 1.0e20
      x_range_um: [0.082, 0.134]
      y_range_um: [0.0, 0.025]
    - name: oxide
      kind: insulator
      eps_r: 3.9
      x_range_um: [0.052, 0.082]
      y_range_um: [-0.001, 0.0]

  mesas:
    - x_range_um: [0.052, 0.082]
      height_um: 0.001

contacts:
  - name: source
    surface: top
    x_range_um: [0.014, 0.030]     # the cell's W contact (16 nm, centred on the S/D)
    bias_role: source
  - name: drain
    surface: top
    x_range_um: [0.104, 0.120]
    bias_role: drain
  - name: gate
    surface: top
    x_range_um: [0.052, 0.082]
    bias_role: gate
  - name: body
    surface: bottom
    x_range_um: [0.0, 0.134]
    bias_role: body

physics:
  velocity_saturation: true

# Process stress -> low-field mobility (solver2d/stress_mobility.py).
stress:
  source: planar_flow       # run mechanics/planar_flow.py (or file: <stress_field.npz>)
  flow: nmos_smt
  set: {}                   # planar_flow stressor overrides, e.g. {liner_nmos_GPa: 0}
  align: gate               # the stress cell's gate centre on the device gate centre (Lg checked)
  piezo: saturating         # saturating (default) | linear
  doping_factor: true       # Kanda (n) / Richter (p) doping factor of the coefficients

gate:
  workfunction_eV: 4.17     # n+ poly-like: Vt ~ 0.3 V

mesh:
  style: quadtree
  h_min_um: 0.0005
  h_max_um: 0.01
  growth: 1.3
  interface_h_um: 0.0005
  junction_h_um: 0.001
  refine_boxes:
    - name: channel
      x_range_um: [0.04, 0.094]
      y_range_um: [0.0, 0.008]
      h_um: 0.001

bias:
  vgs_start_V: 0.0
  vgs_stop_V: 1.0
  vgs_step_V: 0.05
  vds_transfer_V: [0.05, 1.0]
  vgs_for_output_V: []

output:
  structure_file: null
  save_bias_points: "last"
