# First 2D planar NMOS transistor: same oxide/gate stack as the MOS
# capacitor (configs/input_mos_2d.yaml), now with n+ source/drain regions
# dug into the p substrate on either side of the channel and connected to
# their own ohmic contacts - a real current path exists now (source to
# drain, modulated by the gate), so the full coupled Poisson+continuity
# solver (solver2d/newton_solver_qf_2d.py, the same one the 2D diode uses)
# is required instead of the MOS capacitor's Poisson-only solver.
#
# A genuine (if modest) short-channel device: Lg=0.5um. Domain convention:
# x in [0, width_um], y=0 is the substrate's own top surface, the gate
# mesa protrudes to y=-oxide thickness over the channel only.

geometry:
  width_um: 1.1     # source(0.3) + channel/Lg(0.5) + drain(0.3)
  height_um: 0.5     # substrate depth

  substrate:
    doping_type: p
    concentration_cm3: 1.0e16

  regions:
    - name: source
      doping_type: n
      concentration_cm3: 1.0e20
      x_range_um: [0.0, 0.3]
      y_range_um: [0.0, 0.15]   # shallow junction depth
    - name: drain
      doping_type: n
      concentration_cm3: 1.0e20
      x_range_um: [0.8, 1.1]
      y_range_um: [0.0, 0.15]
    - name: oxide
      kind: insulator
      eps_r: 3.9
      x_range_um: [0.3, 0.8]     # exactly the channel (gate) footprint
      y_range_um: [-0.005, 0.0]   # 5nm

  mesas:
    - x_range_um: [0.3, 0.8]
      height_um: 0.005

contacts:
  # Source/drain contacts are inset 0.05um from the gate edge: a real
  # contact/silicide never runs flush up to the gate, and it keeps the
  # contact edge off the mesa/gate-oxide corner.
  - name: source
    surface: top
    x_range_um: [0.0, 0.25]
    bias_role: source
  - name: drain
    surface: top
    x_range_um: [0.85, 1.1]
    bias_role: drain
  - name: gate
    surface: top
    x_range_um: [0.3, 0.8]
    bias_role: gate
  - name: body
    surface: bottom
    x_range_um: [0.0, 1.1]
    bias_role: body

material:
  # Silicon defaults - leave commented out.
  # eps_r: 11.7
  # ni_cm3: 1.0e10

physics:
  # Caughey-Thomas high-field mobility (vsat_n=1e7 cm/s, beta_n=2 - see
  # core/params.py), driven by the electrostatic field along each mesh
  # edge (solver2d/newton_solver_qf_2d.py::edge_mobility).
  velocity_saturation: true

gate:
  workfunction_eV: null   # null = ideal MOS (V_FB=0), same as the MOS capacitor

mesh:
  # Balanced square quadtree (mesh2d/quadtree.py): a coarse h_max grid,
  # refined inside each refine_box, graded from interface_h at the
  # oxide/silicon interface and from junction_h at the S/D junctions.
  # Every triangle is 45-45-90 (no obtuse angles, checked on every build).
  # h_min is the finest spacing anywhere (also the solver's scaling length).
  style: quadtree
  h_min_um: 0.0025
  h_max_um: 0.05
  growth: 1.3
  interface_h_um: 0.0025
  junction_h_um: 0.005
  refine_boxes:
    - name: channel          # inversion layer + drain pinch-off region
      x_range_um: [0.2, 0.9]
      y_range_um: [0.0, 0.04]
      h_um: 0.01

bias:
  # Id-Vg (transfer): one curve per vds_transfer_V entry (low Vds first,
  # high Vds last - DIBL/SS/Vt are extracted from those two).
  vgs_start_V: -0.3
  vgs_stop_V: 1.5
  vgs_step_V: 0.05
  vds_transfer_V: [0.05, 1.0]

  # Id-Vd (output): one curve per vgs_for_output_V entry.
  vds_start_V: 0.0
  vds_stop_V: 1.5
  vds_step_V: 0.1
  vgs_for_output_V: [0.9, 1.1, 1.3, 1.5]

output:
  structure_file: mosfet2d_structure.json
  save_bias_points: "last"   # transfer/output sweeps together can produce a lot of
                                # points - just keep the final (highest-bias) one
                                # of each sweep by default for the field viewer
