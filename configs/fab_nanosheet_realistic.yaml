# Nanosheet (GAA) NMOS with the realistic process profile (profile: realistic;
# DEVELOPMENT_LOG 79): slanted S/D recess with a rounded bottom corner, so the
# sheets are 25 / 26 / 27-28 nm long top to bottom. The ideal-profile device
# is configs/fab_nanosheet.yaml. Lengths in nm unless a unit is given.
#
#   python3 -m fab build configs/fab_nanosheet_realistic.yaml
#   python3 -m tcadview out/fab_nanosheet_realistic/build.pvd
template: nanosheet
params:
  profile: realistic
  type: nmos
  cpp: 48nm
  Lg: 15nm
  n_sheets: 3
  t_sheet: 5nm
  W_sheet: 25nm
  t_sige: 9nm
  isolation: pts
